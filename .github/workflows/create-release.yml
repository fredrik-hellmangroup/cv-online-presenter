name: Create release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest vMAJOR.MINOR.PATCH tag to increase
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      confirm_release:
        description: Confirm creating a tag that deploys main to production
        required: true
        type: boolean
        default: false

run-name: Create ${{ inputs.bump }} release from ${{ github.ref_name }}

concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Validate release request
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          REQUESTED_REF: ${{ github.ref }}
        run: |
          if [ "$REQUESTED_REF" != "refs/heads/main" ]; then
            echo "::error::Releases can only be created from the main branch."
            exit 1
          fi
          if [ "$CONFIRM_RELEASE" != "true" ]; then
            echo "::error::confirm_release must be enabled to create a production release."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # Tags and dispatches made with GITHUB_TOKEN do not start push-triggered workflows,
      # so the release workflow is dispatched explicitly on the new tag below.
      - name: Require green quality gates on this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $runs = gh run list `
            --repo $env:REPOSITORY `
            --workflow quality.yml `
            --branch main `
            --event push `
            --commit $env:RELEASE_COMMIT `
            --json conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Quality gates runs.' }
          if (-not (@($runs) | Where-Object { $_.conclusion -eq 'success' })) {
            throw "Quality gates have not passed for $env:RELEASE_COMMIT on main."
          }
      - name: Create tag and start the release workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          BUMP: ${{ inputs.bump }}
        run: |
          $existingTags = @(git tag --list 'v*')
          $tag = & ./scripts/get-next-release-tag.ps1 -Bump $env:BUMP -ExistingTags $existingTags
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Could not calculate the next release tag.'
          }

          # The ref creation fails if the tag already exists, so a tag is never moved.
          gh api --method POST "repos/$env:REPOSITORY/git/refs" `
            -f "ref=refs/tags/$tag" `
            -f "sha=$env:RELEASE_COMMIT" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not create tag '$tag'." }

          gh workflow run release.yml --repo $env:REPOSITORY --ref $tag
          if ($LASTEXITCODE -ne 0) {
            throw "Tag '$tag' was created but the release workflow could not be started. Run: gh workflow run release.yml --ref $tag"
          }

          "Created $tag at $env:RELEASE_COMMIT and started the IIS release workflow." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
