name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tools/a11y/package-lock.json
      - run: dotnet restore CvOnlinePresenter.sln
      - run: npm ci --prefix client
      - run: npm ci --prefix tools/a11y
      - run: npm run build
      - run: npm run build:metadata
      - run: dotnet build CvOnlinePresenter.sln --configuration Release --no-restore
      - run: npm run validate:content
      - run: npm audit --prefix client --audit-level=moderate
      - run: npm audit --prefix tools/a11y --audit-level=moderate
      - name: Scan repository for secrets
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --no-git --redact --exit-code 1
      - run: dotnet list CvOnlinePresenter.sln package --vulnerable --include-transitive

  browser-quality:
    needs: build-and-security
    timeout-minutes: 20
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            runner: windows-latest
          - browser: firefox
            runner: ubuntu-24.04
          - browser: webkit
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix client
      - run: npm run build
      - run: dotnet build CvOnlinePresenter.sln --configuration Release
      - run: npm ci --prefix tools/a11y
      - if: matrix.runner == 'ubuntu-24.04'
        run: npx --prefix tools/a11y playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.runner == 'windows-latest'
        run: npx --prefix tools/a11y playwright install ${{ matrix.browser }}
      - run: npm --prefix tools/a11y test -- --project=${{ matrix.browser }}


