name: IIS release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: windows-latest
    outputs:
      package_sha256: ${{ steps.package-digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH."
          }
      - name: Verify release commit is on main
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to refresh origin/main before validating the release commit.'
          }
          git merge-base --is-ancestor $env:RELEASE_COMMIT origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit reachable from main.'
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix client
      - run: npm run build
      - run: npm run build:metadata
      - run: npm run validate:content
      - run: dotnet restore CvOnlinePresenter.sln
      - run: dotnet publish src/Portfolio.Web/Portfolio.Web.csproj --configuration Release --no-restore --output artifacts/publish
      - name: Write release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/write-release-notes.mjs "$env:RELEASE_TAG"
      - name: Create versioned IIS package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = "artifacts/cv-online-presenter-$env:RELEASE_TAG.zip"
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath $package -CompressionLevel Optimal
      - name: Compute package SHA-256
        id: package-digest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = "artifacts/cv-online-presenter-$env:RELEASE_TAG.zip"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv-online-presenter-${{ github.ref_name }}
          path: artifacts/cv-online-presenter-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-${{ github.ref_name }}
          path: artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 90

  publish-release:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cv-online-presenter-${{ github.ref_name }}
          path: artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes-${{ github.ref_name }}
          path: release-notes
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $package = Get-ChildItem -Path artifact -Filter '*.zip' -File | Select-Object -First 1
          $notes = Join-Path 'release-notes' 'release-notes.md'
          if ($null -eq $package) { throw 'Versioned package is missing.' }
          gh release create $env:RELEASE_TAG $package.FullName --repo $env:REPOSITORY --title $env:RELEASE_TAG --notes-file $notes

  deploy:
    needs: [package, publish-release]
    runs-on: windows-latest
    timeout-minutes: 20
    environment:
      name: production-msdeploy
      url: ${{ vars.DEPLOY_HEALTH_URL }}
    permissions:
      actions: read
      contents: write
    env:
      MSDEPLOY_SERVER_URL: ${{ vars.MSDEPLOY_SERVER_URL }}
      MSDEPLOY_SITE_NAME: ${{ vars.MSDEPLOY_SITE_NAME }}
      MSDEPLOY_CERTIFICATE_SHA256: ${{ vars.MSDEPLOY_CERTIFICATE_SHA256 }}
      MSDEPLOY_CONTENT_PATH: ${{ vars.MSDEPLOY_CONTENT_PATH }}
      DEPLOY_USERNAME: ${{ vars.DEPLOY_USERNAME }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production-state
          path: production-state
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure verified Microsoft Web Deploy is available
        shell: pwsh
        run: .\scripts\ensure-webdeploy.ps1 -InstallerPath (Join-Path $env:RUNNER_TEMP 'WebDeploy_amd64_en-US.msi')
      # The runner durably commits pending-v1.json before its first sync, then updates LKG/clears pending only after verification.
      - name: Deploy, verify, and reconcile pending/LKG state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          PACKAGE_SHA256: ${{ needs.package.outputs.package_sha256 }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          .\scripts\run-production-deployment.ps1 `
            -StateDirectory 'production-state' `
            -StateRecordPath 'state-record/lkg-v1.json' `
            -ExpectedPackageSha256 $env:PACKAGE_SHA256 `
            -Mode release `
            -SourceCommit $env:SOURCE_COMMIT `
            -SourceTag $env:SOURCE_TAG
