name: IIS release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH."
          }
      - name: Verify release commit is on main
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to refresh origin/main before validating the release commit.'
          }
          git merge-base --is-ancestor $env:RELEASE_COMMIT origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit reachable from main.'
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix client
      - run: npm run build
      - run: npm run build:metadata
      - run: npm run validate:content
      - run: dotnet restore CvOnlinePresenter.sln
      - run: dotnet publish src/Portfolio.Web/Portfolio.Web.csproj --configuration Release --no-restore --output artifacts/publish
      - name: Write release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/write-release-notes.mjs "$env:RELEASE_TAG"
      - name: Create versioned IIS package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = "artifacts/cv-online-presenter-$env:RELEASE_TAG.zip"
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath $package -CompressionLevel Optimal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv-online-presenter-${{ github.ref_name }}
          path: artifacts/cv-online-presenter-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-${{ github.ref_name }}
          path: artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 90

  publish-release:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cv-online-presenter-${{ github.ref_name }}
          path: artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes-${{ github.ref_name }}
          path: release-notes
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $package = Get-ChildItem -Path artifact -Filter '*.zip' -File | Select-Object -First 1
          $notes = Join-Path 'release-notes' 'release-notes.md'
          if ($null -eq $package) { throw 'Versioned package is missing.' }
          gh release create $env:RELEASE_TAG $package.FullName --repo $env:REPOSITORY --title $env:RELEASE_TAG --notes-file $notes

  deploy:
    needs: [package, publish-release]
    runs-on: windows-latest
    timeout-minutes: 10
    environment:
      name: production-msdeploy
      url: ${{ vars.DEPLOY_HEALTH_URL }}
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      MSDEPLOY_SERVER_URL: ${{ vars.MSDEPLOY_SERVER_URL }}
      MSDEPLOY_SITE_NAME: ${{ vars.MSDEPLOY_SITE_NAME }}
      MSDEPLOY_CERTIFICATE_SHA256: ${{ vars.MSDEPLOY_CERTIFICATE_SHA256 }}
      MSDEPLOY_CONTENT_PATH: ${{ vars.MSDEPLOY_CONTENT_PATH }}
      DEPLOY_USERNAME: ${{ vars.DEPLOY_USERNAME }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cv-online-presenter-${{ github.ref_name }}
          path: artifact
      - name: Extract versioned IIS package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path artifact -Filter '*.zip' -File | Select-Object -First 1
          if ($null -eq $package) { throw 'Versioned package is missing.' }
          Expand-Archive -LiteralPath $package.FullName -DestinationPath artifact/publish -Force
          $requiredFiles = @('web.config', 'Portfolio.Web.dll')
          foreach ($requiredFile in $requiredFiles) {
            $requiredPath = Join-Path 'artifact/publish' $requiredFile
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Versioned package is missing required file '$requiredFile'."
            }
          }
      - name: Ensure verified Microsoft Web Deploy is available
        shell: pwsh
        run: .\scripts\ensure-webdeploy.ps1 -InstallerPath (Join-Path $env:RUNNER_TEMP 'WebDeploy_amd64_en-US.msi')
      - name: Deploy release with MSDeploy
        shell: powershell
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          .\scripts\deploy-beebyte-iis.ps1 `
            -SourcePath 'artifact/publish' `
            -DeployContentPath $env:MSDEPLOY_CONTENT_PATH `
            -DeployServerUrl $env:MSDEPLOY_SERVER_URL `
            -DeploySiteName $env:MSDEPLOY_SITE_NAME `
            -DeployUsername $env:DEPLOY_USERNAME `
            -DeployCertificateSha256 $env:MSDEPLOY_CERTIFICATE_SHA256 `
            -OfflinePagePath '.\deployment\app_offline.htm'
      - name: Verify site health
        shell: pwsh
        run: |
          .\scripts\health-check.ps1 -Url $env:DEPLOY_HEALTH_URL
          $metadataUrl = [Uri]::new([Uri]$env:DEPLOY_HEALTH_URL, '/build-metadata.json')
          .\scripts\verify-build-metadata.ps1 `
            -Url $metadataUrl.AbsoluteUri `
            -ExpectedMetadataPath 'artifact/publish/wwwroot/build-metadata.json'
