name: Reusable content validation

on:
  workflow_call:
    inputs:
      app_repository:
        description: Exact owner/repository from the caller's uses reference; it must contain the pinned app SHA and trusted tooling
        required: true
        type: string
      app_sha:
        description: Same immutable 40-character literal SHA as the caller's uses reference and generated content provenance
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate application checkout inputs
        shell: pwsh
        env:
          APP_REPOSITORY: ${{ inputs.app_repository }}
          APP_SHA: ${{ inputs.app_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # job.workflow_* identifies this workflow's source, including local nested calls.
          # These properties are GitHub.com-only; missing values on GHES fail closed.
          if ($env:APP_REPOSITORY -cnotmatch '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$') {
            throw 'app_repository must use owner/repository form.'
          }
          if ($env:APP_SHA -cnotmatch '^[a-f0-9]{40}$') {
            throw 'app_sha must be a full 40-character lowercase Git commit SHA.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WORKFLOW_REPOSITORY) -or $env:APP_REPOSITORY -cne $env:WORKFLOW_REPOSITORY) {
            throw 'app_repository must match the repository that supplied this reusable workflow.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WORKFLOW_SHA) -or $env:APP_SHA -cne $env:WORKFLOW_SHA) {
            throw 'app_sha must match the commit that supplied this reusable workflow.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: content-repo
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Verify exact application commit
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          git -C app fetch --no-tags origin refs/heads/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch the trusted application main branch.'
          }
          git -C app merge-base --is-ancestor $env:APP_SHA FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'app_sha must be reachable from the trusted application main branch.'
          }
          $actual = (git -C app rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:APP_SHA) {
            throw 'The application checkout does not match app_sha.'
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: app/global.json
      - name: Install trusted content tooling
        working-directory: app
        shell: pwsh
        run: npm ci
      - name: Audit trusted content tooling dependencies
        working-directory: app
        shell: pwsh
        run: npm audit --audit-level=moderate
      - name: Test content tooling
        working-directory: app
        shell: pwsh
        run: npm run test:content
      - name: Scan caller content repository for secrets
        run: docker run --rm -v "${{ github.workspace }}/content-repo:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --no-git --redact --exit-code 1
      - name: Validate source and generated content
        working-directory: app
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          npm run content:source:validate -- --root ../content-repo --app-commit-sha $env:APP_SHA
          npm run content:check -- --root ../content-repo --app-commit-sha $env:APP_SHA
      - name: Validate content with the Node.js validator
        working-directory: app
        shell: pwsh
        run: npm run content:validate -- --root ../content-repo
      - name: Validate content with the .NET validator
        working-directory: app
        shell: pwsh
        run: dotnet run --project tools/Portfolio.Content.Validator -- --content ../content-repo/content/pages
