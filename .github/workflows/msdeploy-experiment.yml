name: MSDeploy experiment

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm a manual deployment to the production IIS site
        required: true
        type: boolean
        default: false
      rollback_release_tag:
        description: Optional existing vMAJOR.MINOR.PATCH or recovery/manual release tag to redeploy
        required: false
        type: string
        default: ''
      reconcile_pending:
        description: Explicitly confirm manual recovery of a previously pending production deployment
        required: false
        type: boolean
        default: false

run-name: MSDeploy experiment from ${{ github.ref_name }}

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: windows-latest
    outputs:
      package_sha256: ${{ steps.package-digest.outputs.sha256 }}
    steps:
      - name: Validate manual production request
        shell: pwsh
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          REQUESTED_REF: ${{ github.ref }}
          ROLLBACK_RELEASE_TAG: ${{ inputs.rollback_release_tag }}
        run: |
          if ($env:REQUESTED_REF -ne 'refs/heads/main') {
            throw 'MSDeploy experiments must run from the main branch.'
          }
          if ($env:CONFIRM_PRODUCTION -ne 'true') {
            throw 'confirm_production must be enabled for a production MSDeploy experiment.'
          }
          if (
            $env:ROLLBACK_RELEASE_TAG -and
            $env:ROLLBACK_RELEASE_TAG -notmatch '^(?:v[0-9]+\.[0-9]+\.[0-9]+|recovery/manual-[0-9]+-[0-9]+)$'
          ) {
            throw 'rollback_release_tag must be empty or use a semantic release or recovery/manual tag.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: inputs.rollback_release_tag == ''
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.rollback_release_tag == ''
        with:
          node-version: 24
      - if: inputs.rollback_release_tag == ''
        run: npm ci --prefix client
      - if: inputs.rollback_release_tag == ''
        run: npm run build
      - if: inputs.rollback_release_tag == ''
        run: npm run build:metadata
      - if: inputs.rollback_release_tag == ''
        run: npm run validate:content
      - if: inputs.rollback_release_tag == ''
        run: dotnet restore CvOnlinePresenter.sln
      - if: inputs.rollback_release_tag == ''
        run: dotnet publish src/Portfolio.Web/Portfolio.Web.csproj --configuration Release --no-restore --output artifacts/publish
      - name: Create MSDeploy experiment package
        if: inputs.rollback_release_tag == ''
        shell: pwsh
        run: Compress-Archive -Path 'artifacts/publish/*' -DestinationPath 'artifacts/msdeploy-experiment.zip' -CompressionLevel Optimal
      - name: Download immutable rollback package
        if: inputs.rollback_release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_RELEASE_TAG: ${{ inputs.rollback_release_tag }}
        run: |
          New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null
          $gitAuthorization = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $gitAuthorization" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not refresh origin/main before validating the rollback tag.'
          }
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $gitAuthorization" fetch --force origin "refs/tags/$($env:ROLLBACK_RELEASE_TAG):refs/tags/$($env:ROLLBACK_RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch rollback tag '$env:ROLLBACK_RELEASE_TAG'."
          }
          $releaseCommit = (git rev-list -n 1 "refs/tags/$($env:ROLLBACK_RELEASE_TAG)").Trim()
          if ($LASTEXITCODE -ne 0 -or $releaseCommit -notmatch '^[a-f0-9]{40}$') {
            throw "Could not resolve rollback tag '$env:ROLLBACK_RELEASE_TAG' to a commit."
          }
          git merge-base --is-ancestor $releaseCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Rollback tag '$env:ROLLBACK_RELEASE_TAG' must point to a commit reachable from main."
          }

          if ($env:ROLLBACK_RELEASE_TAG -match '^recovery/manual-([0-9]+-[0-9]+)$') {
            $assetName = "cv-online-presenter-manual-$($Matches[1]).zip"
          } else {
            $assetName = "cv-online-presenter-$env:ROLLBACK_RELEASE_TAG.zip"
          }
          $release = gh release view $env:ROLLBACK_RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read release '$env:ROLLBACK_RELEASE_TAG'."
          }
          $assets = @($release.assets | Where-Object { $_.name -ceq $assetName })
          if ($assets.Count -ne 1 -or $assets[0].digest -notmatch '^sha256:[a-f0-9]{64}$') {
            throw "Release asset '$assetName' must have exactly one GitHub SHA-256 digest."
          }

          gh release download $env:ROLLBACK_RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $assetName `
            --dir 'artifacts'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download release asset '$assetName'."
          }

          $downloadedPath = Join-Path 'artifacts' $assetName
          $actualDigest = (Get-FileHash -LiteralPath $downloadedPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedDigest = $assets[0].digest.Substring('sha256:'.Length)
          if ($actualDigest -cne $expectedDigest) {
            throw "Release asset '$assetName' did not match its GitHub SHA-256 digest."
          }
          Move-Item -LiteralPath $downloadedPath -Destination 'artifacts/msdeploy-experiment.zip'
      - name: Validate deployment package
        shell: pwsh
        run: |
          Expand-Archive `
            -LiteralPath 'artifacts/msdeploy-experiment.zip' `
            -DestinationPath 'artifacts/package-validation' `
            -Force
          foreach ($requiredFile in @('web.config', 'Portfolio.Web.dll', 'wwwroot/build-metadata.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'artifacts/package-validation' $requiredFile) -PathType Leaf)) {
              throw "MSDeploy package is missing required file '$requiredFile'."
            }
          }
          Remove-Item -LiteralPath 'artifacts/package-validation' -Recurse -Force
      - name: Compute package SHA-256
        id: package-digest
        shell: pwsh
        run: |
          $digest = (Get-FileHash -LiteralPath 'artifacts/msdeploy-experiment.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msdeploy-experiment-${{ github.run_id }}
          path: artifacts/msdeploy-experiment.zip
          if-no-files-found: error
          retention-days: 14

  archive_manual_recovery:
    needs: package
    if: inputs.rollback_release_tag == ''
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msdeploy-experiment-${{ github.run_id }}
          path: artifact
      - name: Publish recovery package at the packaged source commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          PACKAGE_SHA256: ${{ needs.package.outputs.package_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $package = Join-Path 'artifact' 'msdeploy-experiment.zip'
          $archiveAssetName = "cv-online-presenter-manual-$($env:RUN_ID)-$($env:RUN_ATTEMPT).zip"
          $archivePackage = Join-Path 'artifact' $archiveAssetName
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') {
            throw 'The packaged source commit is invalid.'
          }
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:PACKAGE_SHA256) {
            throw 'Manual recovery source bytes do not match the package job SHA-256.'
          }
          $tag = "recovery/manual-$env:RUN_ID-$env:RUN_ATTEMPT"
          $assetName = "cv-online-presenter-manual-$env:RUN_ID-$env:RUN_ATTEMPT.zip"
          Copy-Item -LiteralPath $package -Destination $archivePackage
          $sourceDigest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $archivedBytesDigest = (Get-FileHash -LiteralPath $archivePackage -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceDigest -cne $env:PACKAGE_SHA256 -or $archivedBytesDigest -cne $sourceDigest) {
            throw 'Recovery archive bytes must exactly match the package job bytes and digest.'
          }
          gh release create $tag $archivePackage `
            --repo $env:REPOSITORY `
            --title $tag `
            --notes 'Immutable production recovery package archived before manual-main deployment.' `
            --target $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish immutable manual recovery release '$tag'."
          }
          $published = gh release view $tag --repo $env:REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not verify manual recovery release '$tag'." }
          $assets = @($published.assets | Where-Object { $_.name -ceq $assetName })
          if ($assets.Count -ne 1 -or $assets[0].digest -cne "sha256:$sourceDigest") {
            throw "Published recovery asset '$assetName' name/digest does not match the archived package."
          }

  deploy:
    needs: [package, archive_manual_recovery]
    if: >-
      ${{
        always() &&
        needs.package.result == 'success' &&
        (needs.archive_manual_recovery.result == 'success' || needs.archive_manual_recovery.result == 'skipped')
      }}
    runs-on: windows-latest
    timeout-minutes: 20
    environment:
      name: production-msdeploy
      url: ${{ vars.DEPLOY_HEALTH_URL }}
    permissions:
      actions: read
      contents: write
    env:
      MSDEPLOY_SERVER_URL: ${{ vars.MSDEPLOY_SERVER_URL }}
      MSDEPLOY_SITE_NAME: ${{ vars.MSDEPLOY_SITE_NAME }}
      MSDEPLOY_CERTIFICATE_SHA256: ${{ vars.MSDEPLOY_CERTIFICATE_SHA256 }}
      MSDEPLOY_CONTENT_PATH: ${{ vars.MSDEPLOY_CONTENT_PATH }}
      DEPLOY_USERNAME: ${{ vars.DEPLOY_USERNAME }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production-state
          path: production-state
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msdeploy-experiment-${{ github.run_id }}
          path: artifact
      - name: Ensure verified Microsoft Web Deploy is available
        shell: pwsh
        run: .\scripts\ensure-webdeploy.ps1 -InstallerPath (Join-Path $env:RUNNER_TEMP 'WebDeploy_amd64_en-US.msi')
      # The runner durably commits pending-v1.json before its first sync, then updates LKG/clears pending only after verification.
      - name: Deploy, verify, and reconcile pending/LKG state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.rollback_release_tag }}
          SOURCE_COMMIT: ${{ github.sha }}
          PACKAGE_SHA256: ${{ needs.package.outputs.package_sha256 }}
          MANUAL_MAIN: ${{ inputs.rollback_release_tag == '' }}
          RECONCILE_PENDING: ${{ inputs.reconcile_pending }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          $package = Join-Path 'artifact' 'msdeploy-experiment.zip'
          $arguments = @(
            '-PackagePath', $package,
            '-StateDirectory', 'production-state',
            '-StateRecordPath', 'state-record/lkg-v1.json',
            '-ExpectedPackageSha256', $env:PACKAGE_SHA256,
            '-Mode', 'manual',
            '-SourceCommit', $env:SOURCE_COMMIT,
            '-SourceTag', $env:SOURCE_TAG
          )
          if ($env:MANUAL_MAIN -eq 'true') { $arguments += '-ManualMain' }
          if ($env:RECONCILE_PENDING -eq 'true') { $arguments += '-AllowPendingRecovery' }
          .\scripts\run-production-deployment.ps1 @arguments
