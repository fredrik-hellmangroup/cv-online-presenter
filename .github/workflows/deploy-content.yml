name: Reusable deploy content

on:
  workflow_call:
    inputs:
      app_repository:
        description: Exact owner/repository from the caller's uses reference; it must contain the pinned app SHA and trusted tooling
        required: true
        type: string
      app_sha:
        description: Same immutable 40-character literal SHA as the caller's uses reference and generated content provenance
        required: true
        type: string
      activate_release_id:
        description: Rollback by activating an existing release without uploading
        required: false
        type: string
        default: ''
    secrets:
      DEPLOY_PASSWORD:
        required: true
      CONTENT_ACTIVATION_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-content
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.activate_release_id == ''
    uses: ./.github/workflows/validate-content.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      app_sha: ${{ inputs.app_sha }}

  deploy:
    needs: validate
    if: >-
      ${{
        !cancelled() &&
        github.ref == 'refs/heads/main' &&
        (
          needs.validate.result == 'success' ||
          (inputs.activate_release_id != '' && needs.validate.result == 'skipped')
        )
      }}
    runs-on: windows-latest
    environment: production-content
    env:
      MSDEPLOY_SERVER_URL: ${{ vars.MSDEPLOY_SERVER_URL }}
      MSDEPLOY_SITE_NAME: ${{ vars.MSDEPLOY_SITE_NAME }}
      MSDEPLOY_CERTIFICATE_SHA256: ${{ vars.MSDEPLOY_CERTIFICATE_SHA256 }}
      MSDEPLOY_CONTENT_RELEASES_PATH: ${{ vars.MSDEPLOY_CONTENT_RELEASES_PATH }}
      DEPLOY_USERNAME: ${{ vars.DEPLOY_USERNAME }}
      CONTENT_ACTIVATION_URL: ${{ vars.CONTENT_ACTIVATION_URL }}
      APP_REPOSITORY: ${{ inputs.app_repository }}
      APP_SHA: ${{ inputs.app_sha }}
      ROLLBACK_RELEASE_ID: ${{ inputs.activate_release_id }}
    steps:
      - name: Verify reusable workflow identity
        shell: pwsh
        env:
          APP_REPOSITORY: ${{ inputs.app_repository }}
          APP_SHA: ${{ inputs.app_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # job.workflow_* identifies this workflow's source.
          # These properties are GitHub.com-only; missing values on GHES fail closed.
          if ($env:APP_REPOSITORY -cnotmatch '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$') {
            throw 'app_repository must use owner/repository form.'
          }
          if ($env:APP_SHA -cnotmatch '^[a-f0-9]{40}$') {
            throw 'app_sha must be a full 40-character lowercase Git commit SHA.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WORKFLOW_REPOSITORY) -or $env:APP_REPOSITORY -cne $env:WORKFLOW_REPOSITORY) {
            throw 'app_repository must match the repository that supplied this reusable workflow.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WORKFLOW_SHA) -or $env:APP_SHA -cne $env:WORKFLOW_SHA) {
            throw 'app_sha must match the commit that supplied this reusable workflow.'
          }
      - name: Validate deployment configuration and required secrets
        shell: pwsh
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          CONTENT_ACTIVATION_TOKEN: ${{ secrets.CONTENT_ACTIVATION_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CONTENT_ACTIVATION_TOKEN)) {
            throw 'CONTENT_ACTIVATION_TOKEN is required.'
          }
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_PASSWORD)) {
            throw 'DEPLOY_PASSWORD is required.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CONTENT_ACTIVATION_URL) -or $env:CONTENT_ACTIVATION_URL -notmatch '^https://') {
            throw 'CONTENT_ACTIVATION_URL must be an https:// URL.'
          }
          if ($env:ROLLBACK_RELEASE_ID -and $env:ROLLBACK_RELEASE_ID -notmatch '^[A-Za-z0-9_-]{1,100}$') {
            throw 'activate_release_id contains invalid characters.'
          }
          if (-not $env:ROLLBACK_RELEASE_ID) {
            $required = @(
              'MSDEPLOY_SERVER_URL',
              'MSDEPLOY_SITE_NAME',
              'MSDEPLOY_CERTIFICATE_SHA256',
              'MSDEPLOY_CONTENT_RELEASES_PATH',
              'DEPLOY_USERNAME'
            )
            foreach ($name in $required) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                throw "Environment variable '$name' is required."
              }
            }
            if ($env:MSDEPLOY_SITE_NAME -notmatch '^[A-Za-z0-9](?:[A-Za-z0-9 ._-]{0,126}[A-Za-z0-9_-])?$') {
              throw 'MSDEPLOY_SITE_NAME contains invalid characters or formatting.'
            }
            $normalizedReleasesPath = $env:MSDEPLOY_CONTENT_RELEASES_PATH.Replace('\', '/').TrimEnd('/')
            $expectedReleasesPath = "$($env:MSDEPLOY_SITE_NAME)/App_Data/content-releases"
            if ($normalizedReleasesPath -cne $expectedReleasesPath) {
              throw 'MSDEPLOY_CONTENT_RELEASES_PATH must match the configured site root content-releases path.'
            }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ROLLBACK_RELEASE_ID == ''
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: content-repo
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Verify exact application commit
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          git -C app fetch --no-tags origin refs/heads/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch the trusted application main branch.'
          }
          git -C app merge-base --is-ancestor $env:APP_SHA FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'app_sha must be reachable from the trusted application main branch.'
          }
          $actual = (git -C app rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:APP_SHA) {
            throw 'The application checkout does not match app_sha.'
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Package release
        if: env.ROLLBACK_RELEASE_ID == ''
        shell: pwsh
        run: |
          $releaseId = '{0}-{1}' -f (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss'), $env:GITHUB_SHA.Substring(0, 7)
          "RELEASE_ID=$releaseId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item content-repo/content/site.json release/site.json
          Copy-Item content-repo/content/pages release/pages -Recurse
      - name: Ensure verified Microsoft Web Deploy is available
        if: env.ROLLBACK_RELEASE_ID == ''
        shell: pwsh
        run: .\app\scripts\ensure-webdeploy.ps1 -InstallerPath (Join-Path $env:RUNNER_TEMP 'WebDeploy_amd64_en-US.msi')
      - name: Upload release folder with Web Deploy
        if: env.ROLLBACK_RELEASE_ID == ''
        shell: powershell
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          .\app\scripts\deploy-beebyte-iis.ps1 `
            -ContentRelease `
            -SourcePath 'release' `
            -DeployContentPath ("{0}/{1}" -f $env:MSDEPLOY_CONTENT_RELEASES_PATH.TrimEnd('/', '\'), $env:RELEASE_ID) `
            -DeployServerUrl $env:MSDEPLOY_SERVER_URL `
            -DeploySiteName $env:MSDEPLOY_SITE_NAME `
            -DeployUsername $env:DEPLOY_USERNAME `
            -DeployCertificateSha256 $env:MSDEPLOY_CERTIFICATE_SHA256
      - name: Preview, activate, and verify release
        shell: pwsh
        env:
          CONTENT_ACTIVATION_TOKEN: ${{ secrets.CONTENT_ACTIVATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseId = if ($env:ROLLBACK_RELEASE_ID) { $env:ROLLBACK_RELEASE_ID } else { $env:RELEASE_ID }
          $base = $env:CONTENT_ACTIVATION_URL.TrimEnd('/')
          $headers = @{ 'X-Content-Activation-Token' = $env:CONTENT_ACTIVATION_TOKEN }
          $preview = Invoke-RestMethod -Method Post -Uri "$base/internal/content/preview/$releaseId" -Headers $headers -MaximumRedirection 0 -TimeoutSec 30
          if ($null -eq $preview) { throw 'Preview returned no result; activation is blocked.' }
          foreach ($field in @('added', 'removed', 'changed')) {
            $previewField = $preview.PSObject.Properties[$field]
            if ($null -eq $previewField -or $previewField.Value -isnot [System.Array]) {
              throw "Preview result is missing the expected '$field' list; activation is blocked."
            }
          }
          Write-Output ("Preview diff: {0} added, {1} removed, {2} changed section(s)." -f @($preview.added).Count, @($preview.removed).Count, @($preview.changed).Count)
          $activated = Invoke-RestMethod -Method Post -Uri "$base/internal/content/activate/$releaseId" -Headers $headers -MaximumRedirection 0 -TimeoutSec 30
          if ($null -eq $activated -or $activated.toVersion -isnot [string] -or [string]::IsNullOrWhiteSpace($activated.toVersion)) {
            throw 'Activation response is missing a valid toVersion; active-release verification is blocked.'
          }
          Write-Output "Activated release $releaseId (snapshot $($activated.toVersion))."
          $env:CONTENT_RELEASE_ID = $releaseId
          $env:CONTENT_VERSION = $activated.toVersion
          node app/scripts/content/verify-active-release.mjs
          $health = Invoke-WebRequest -Uri "$base/health" -UseBasicParsing -TimeoutSec 30
          if ($health.StatusCode -ne 200) { throw "Health check returned $($health.StatusCode)." }
