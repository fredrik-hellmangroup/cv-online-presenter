name: Manual production recovery

# Redeploys a release tag that was already deployed successfully. It never builds from a branch.
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm a manual deployment to the production IIS site
        required: true
        type: boolean
        default: false
      rollback_release_tag:
        description: Existing vMAJOR.MINOR.PATCH release tag to redeploy; it must have been deployed successfully before
        required: true
        type: string
      reconcile_pending:
        description: Explicitly confirm manual recovery of a previously pending production deployment
        required: false
        type: boolean
        default: false

run-name: Manual production recovery to ${{ inputs.rollback_release_tag }}

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: windows-latest
    outputs:
      package_sha256: ${{ steps.package-digest.outputs.sha256 }}
    steps:
      - name: Validate manual production request
        shell: pwsh
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          REQUESTED_REF: ${{ github.ref }}
          ROLLBACK_RELEASE_TAG: ${{ inputs.rollback_release_tag }}
        run: |
          if ($env:REQUESTED_REF -ne 'refs/heads/main') {
            throw 'Manual production recovery must run from the main branch.'
          }
          if ($env:CONFIRM_PRODUCTION -ne 'true') {
            throw 'confirm_production must be enabled for manual production recovery.'
          }
          if ($env:ROLLBACK_RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'rollback_release_tag must be an existing vMAJOR.MINOR.PATCH release tag.'
          }
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download immutable rollback package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_RELEASE_TAG: ${{ inputs.rollback_release_tag }}
        run: |
          New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null
          $gitAuthorization = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $gitAuthorization" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not refresh origin/main before validating the rollback tag.'
          }
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $gitAuthorization" fetch --force origin "refs/tags/$($env:ROLLBACK_RELEASE_TAG):refs/tags/$($env:ROLLBACK_RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch rollback tag '$env:ROLLBACK_RELEASE_TAG'."
          }
          $releaseCommit = (git rev-list -n 1 "refs/tags/$($env:ROLLBACK_RELEASE_TAG)").Trim()
          if ($LASTEXITCODE -ne 0 -or $releaseCommit -notmatch '^[a-f0-9]{40}$') {
            throw "Could not resolve rollback tag '$env:ROLLBACK_RELEASE_TAG' to a commit."
          }
          git merge-base --is-ancestor $releaseCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Rollback tag '$env:ROLLBACK_RELEASE_TAG' must point to a commit reachable from main."
          }

          $assetName = "cv-online-presenter-$env:ROLLBACK_RELEASE_TAG.zip"
          $release = gh release view $env:ROLLBACK_RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read release '$env:ROLLBACK_RELEASE_TAG'."
          }
          $assets = @($release.assets | Where-Object { $_.name -ceq $assetName })
          if ($assets.Count -ne 1 -or $assets[0].digest -notmatch '^sha256:[a-f0-9]{64}$') {
            throw "Release asset '$assetName' must have exactly one GitHub SHA-256 digest."
          }

          gh release download $env:ROLLBACK_RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $assetName `
            --dir 'artifacts'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download release asset '$assetName'."
          }

          $downloadedPath = Join-Path 'artifacts' $assetName
          $actualDigest = (Get-FileHash -LiteralPath $downloadedPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedDigest = $assets[0].digest.Substring('sha256:'.Length)
          if ($actualDigest -cne $expectedDigest) {
            throw "Release asset '$assetName' did not match its GitHub SHA-256 digest."
          }
          Move-Item -LiteralPath $downloadedPath -Destination 'artifacts/manual-production-recovery.zip'
      - name: Validate deployment package
        shell: pwsh
        run: |
          Expand-Archive `
            -LiteralPath 'artifacts/manual-production-recovery.zip' `
            -DestinationPath 'artifacts/package-validation' `
            -Force
          foreach ($requiredFile in @('web.config', 'Portfolio.Web.dll', 'wwwroot/build-metadata.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'artifacts/package-validation' $requiredFile) -PathType Leaf)) {
              throw "Manual production recovery package is missing required file '$requiredFile'."
            }
          }
          Remove-Item -LiteralPath 'artifacts/package-validation' -Recurse -Force
      - name: Compute package SHA-256
        id: package-digest
        shell: pwsh
        run: |
          $digest = (Get-FileHash -LiteralPath 'artifacts/manual-production-recovery.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

  deploy:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    environment:
      name: production-msdeploy
      url: ${{ vars.DEPLOY_HEALTH_URL }}
    permissions:
      actions: read
      contents: write
    env:
      MSDEPLOY_SERVER_URL: ${{ vars.MSDEPLOY_SERVER_URL }}
      MSDEPLOY_SITE_NAME: ${{ vars.MSDEPLOY_SITE_NAME }}
      MSDEPLOY_CERTIFICATE_SHA256: ${{ vars.MSDEPLOY_CERTIFICATE_SHA256 }}
      MSDEPLOY_CONTENT_PATH: ${{ vars.MSDEPLOY_CONTENT_PATH }}
      DEPLOY_USERNAME: ${{ vars.DEPLOY_USERNAME }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: production-state
          path: production-state
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure verified Microsoft Web Deploy is available
        shell: pwsh
        run: .\scripts\ensure-webdeploy.ps1 -InstallerPath (Join-Path $env:RUNNER_TEMP 'WebDeploy_amd64_en-US.msi')
      # The runner proves the tag was verified live before (production-state history), downloads and digest-checks the
      # immutable release asset, commits pending-v1.json before its first sync, and updates LKG/clears pending only after verification.
      - name: Deploy, verify, and reconcile pending/LKG state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.rollback_release_tag }}
          SOURCE_COMMIT: ${{ github.sha }}
          PACKAGE_SHA256: ${{ needs.package.outputs.package_sha256 }}
          RECONCILE_PENDING: ${{ inputs.reconcile_pending }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          $arguments = @{
            StateDirectory = 'production-state'
            StateRecordPath = 'state-record/lkg-v1.json'
            ExpectedPackageSha256 = $env:PACKAGE_SHA256
            Mode = 'manual'
            SourceCommit = $env:SOURCE_COMMIT
            SourceTag = $env:SOURCE_TAG
          }
          if ($env:RECONCILE_PENDING -eq 'true') { $arguments['AllowPendingRecovery'] = $true }
          .\scripts\run-production-deployment.ps1 @arguments
